<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird Raman 🐦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ─────────────────────────────────────────────────────────
//  FLAPPY RAMAN — Canvas Edition
//  Authentic Flappy Bird feel with smooth physics
// ─────────────────────────────────────────────────────────

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── SIZING ───────────────────────────────────────────────
const GAME_W = 390;
const GAME_H = 844;
let scale = 1;

function resize() {
  const sw = window.innerWidth, sh = window.innerHeight;
  scale = Math.min(sw / GAME_W, sh / GAME_H);
  canvas.width  = GAME_W * scale;
  canvas.height = GAME_H * scale;
  ctx.scale(scale, scale);
}
resize();
window.addEventListener('resize', resize);

// ── CONSTANTS ────────────────────────────────────────────
const GRAVITY      = 0.38;
const FLAP_VY      = -8.2;
const PIPE_SPEED   = 2.1;
const PIPE_GAP     = 175;
const PIPE_INTERVAL= 100;  // frames
const PIPE_W       = 78;
const GROUND_H     = 112;
const BIRD_X       = 90;
const BIRD_W       = 50;
const BIRD_H       = 50;
const BIRD_HITBOX  = 16; // radius for circle collision

// ── COLORS ───────────────────────────────────────────────
const SKY_TOP    = '#4FC3F7';
const SKY_BOT    = '#B3E5FC';
const PIPE_BODY  = '#5C9E31';
const PIPE_LIGHT = '#74BF3E';
const PIPE_DARK  = '#3A6620';
const PIPE_CAP   = '#5DB030';
const PIPE_CAP_D = '#3A6620';
const GND_TOP    = '#5DB030';
const GND_BOT    = '#DED895';
const GND_LINE   = '#C8C87A';

// ── ASSETS ───────────────────────────────────────────────
const birdImg = new Image();
birdImg.crossOrigin = 'anonymous';
birdImg.src = 'https://i.postimg.cc/C5LkKvLM/raman-bird.png';
let birdLoaded = false;
birdImg.onload = () => { birdLoaded = true; };

// Load pixel font via canvas fallback
function pixelText(text, x, y, size, color = '#fff', outline = '#000') {
  ctx.save();
  ctx.font = `${size}px 'Press Start 2P', 'Courier New', monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = size * 0.22;
  ctx.strokeStyle = outline;
  ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// ── STATE ────────────────────────────────────────────────
let state = 'start'; // start | playing | dead | gameover
let bird, pipes, score, bestScore, frame, groundX, deathTimer;
let flapParticles = [];
let screenShake = 0;

function initGame() {
  bird = { y: GAME_H * 0.38, vy: 0, angle: 0, flapAnim: 0 };
  pipes = [];
  score = 0;
  frame = 0;
  groundX = 0;
  deathTimer = 0;
  flapParticles = [];
  screenShake = 0;
}

bestScore = parseInt(localStorage.getItem('flappyRamanBest2') || '0');
initGame();

// ── INPUT ────────────────────────────────────────────────
let flapQueued = false;

function doFlap() {
  if (state === 'start') {
    state = 'playing';
    bird.vy = FLAP_VY;
    spawnFlap();
    return;
  }
  if (state === 'playing') {
    bird.vy = FLAP_VY;
    spawnFlap();
  }
  if (state === 'gameover') {
    initGame();
    state = 'start';
  }
}

canvas.addEventListener('touchstart', e => { e.preventDefault(); doFlap(); }, { passive: false });
canvas.addEventListener('mousedown', e => { e.preventDefault(); doFlap(); });
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    doFlap();
  }
});

// ── PARTICLES ────────────────────────────────────────────
function spawnFlap() {
  for (let i = 0; i < 5; i++) {
    flapParticles.push({
      x: BIRD_X + Math.random() * 10 - 5,
      y: bird.y + BIRD_H / 2 + 8,
      vx: (Math.random() - 0.5) * 2.5,
      vy: Math.random() * 2 + 1,
      life: 1,
      size: Math.random() * 5 + 3,
      color: Math.random() > 0.5 ? '#fff' : '#B3E5FC'
    });
  }
}

// ── PIPES ────────────────────────────────────────────────
function spawnPipe() {
  const minGapTop = 140;
  const maxGapTop = GAME_H - GROUND_H - PIPE_GAP - 120;
  const gapTop = minGapTop + Math.random() * (maxGapTop - minGapTop);
  pipes.push({ x: GAME_W + 10, gapTop, gapBot: gapTop + PIPE_GAP, scored: false });
}

function drawPipe(x, topH, botY, botH) {
  // Cap width extra
  const CAP_W = PIPE_W + 14;
  const CAP_H = 30;

  // ── TOP PIPE ──
  // Body
  ctx.fillStyle = PIPE_BODY;
  ctx.fillRect(x, 0, PIPE_W, topH);
  // Light strip
  ctx.fillStyle = PIPE_LIGHT;
  ctx.fillRect(x + 8, 0, 12, topH);
  // Dark strip
  ctx.fillStyle = PIPE_DARK;
  ctx.fillRect(x + PIPE_W - 10, 0, 10, topH);
  // Cap
  ctx.fillStyle = PIPE_CAP;
  ctx.fillRect(x - 7, topH - CAP_H, CAP_W, CAP_H);
  ctx.fillStyle = PIPE_LIGHT;
  ctx.fillRect(x - 7 + 8, topH - CAP_H, 12, CAP_H);
  ctx.fillStyle = PIPE_CAP_D;
  ctx.fillRect(x - 7 + CAP_W - 10, topH - CAP_H, 10, CAP_H);
  // Outline
  ctx.strokeStyle = PIPE_DARK;
  ctx.lineWidth = 3;
  ctx.strokeRect(x, 0, PIPE_W, topH);
  ctx.strokeRect(x - 7, topH - CAP_H, CAP_W, CAP_H);

  // ── BOTTOM PIPE ──
  ctx.fillStyle = PIPE_BODY;
  ctx.fillRect(x, botY, PIPE_W, botH);
  ctx.fillStyle = PIPE_LIGHT;
  ctx.fillRect(x + 8, botY, 12, botH);
  ctx.fillStyle = PIPE_DARK;
  ctx.fillRect(x + PIPE_W - 10, botY, 10, botH);
  // Cap
  ctx.fillStyle = PIPE_CAP;
  ctx.fillRect(x - 7, botY, CAP_W, CAP_H);
  ctx.fillStyle = PIPE_LIGHT;
  ctx.fillRect(x - 7 + 8, botY, 12, CAP_H);
  ctx.fillStyle = PIPE_CAP_D;
  ctx.fillRect(x - 7 + CAP_W - 10, botY, 10, CAP_H);
  // Outline
  ctx.strokeStyle = PIPE_DARK;
  ctx.lineWidth = 3;
  ctx.strokeRect(x, botY, PIPE_W, botH);
  ctx.strokeRect(x - 7, botY, CAP_W, CAP_H);
}

// ── GROUND ───────────────────────────────────────────────
function drawGround(scrolling) {
  const gy = GAME_H - GROUND_H;
  // Grass strip
  ctx.fillStyle = GND_TOP;
  ctx.fillRect(0, gy, GAME_W, 24);
  // Dirt
  const grd = ctx.createLinearGradient(0, gy + 24, 0, GAME_H);
  grd.addColorStop(0, '#DED895');
  grd.addColorStop(1, '#C8B860');
  ctx.fillStyle = grd;
  ctx.fillRect(0, gy + 24, GAME_W, GROUND_H - 24);
  // Horizontal lines on dirt
  ctx.strokeStyle = GND_LINE;
  ctx.lineWidth = 1.5;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(0, gy + 24 + i * ((GROUND_H - 24) / 4));
    ctx.lineTo(GAME_W, gy + 24 + i * ((GROUND_H - 24) / 4));
    ctx.stroke();
  }
  // Scrolling grass pattern
  if (scrolling) {
    ctx.fillStyle = '#4a8c22';
    const tileW = 52;
    const offset = groundX % tileW;
    for (let tx = -tileW + offset; tx < GAME_W + tileW; tx += tileW) {
      ctx.fillRect(tx, gy, tileW - 4, 24);
    }
  }
  // Top border line
  ctx.fillStyle = '#3a7a18';
  ctx.fillRect(0, gy, GAME_W, 4);
}

// ── SKY / CLOUDS ─────────────────────────────────────────
let cloudX = 0;
function drawSky() {
  // Gradient sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, GAME_H - GROUND_H);
  skyGrad.addColorStop(0, '#3BB5D8');
  skyGrad.addColorStop(0.6, '#72D0EC');
  skyGrad.addColorStop(1, '#B3E5FC');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, GAME_W, GAME_H - GROUND_H);

  // Simple clouds
  drawCloud(80 + ((cloudX * 0.4) % (GAME_W + 200)) - 100, 90, 0.9);
  drawCloud(260 + ((cloudX * 0.25) % (GAME_W + 200)) - 100, 140, 0.7);
  drawCloud(160 + ((cloudX * 0.55) % (GAME_W + 200)) - 100, 60, 1.1);
}

function drawCloud(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  // Puffball cloud
  const blobs = [[0,0,30],[22,-8,22],[-18,-4,20],[36,2,18],[-32,4,16]];
  blobs.forEach(([bx, by, r]) => {
    ctx.beginPath();
    ctx.arc(bx*s, by*s, r*s, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

// ── BIRD DRAW ─────────────────────────────────────────────
function drawBird() {
  ctx.save();
  ctx.translate(BIRD_X + BIRD_W / 2, bird.y + BIRD_H / 2);
  const clampedAngle = Math.max(-25, Math.min(85, bird.angle));
  ctx.rotate(clampedAngle * Math.PI / 180);

  if (birdLoaded) {
    ctx.drawImage(birdImg, -BIRD_W / 2, -BIRD_H / 2, BIRD_W, BIRD_H);
  } else {
    // Fallback yellow circle
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_W / 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ── COLLISION ─────────────────────────────────────────────
function checkHit() {
  const cx = BIRD_X + BIRD_W / 2;
  const cy = bird.y + BIRD_H / 2;
  const r  = BIRD_HITBOX;

  // Ground / ceiling
  if (bird.y + BIRD_H > GAME_H - GROUND_H + 6) return true;
  if (bird.y < -10) return true;

  for (const p of pipes) {
    // Check circle vs two rects
    const capX  = p.x - 7;
    const capW2 = PIPE_W + 14;

    // Top pipe rect (cap included)
    if (circleRect(cx, cy, r, capX, 0, capW2, p.gapTop)) return true;
    // Bottom pipe rect (cap included)
    const botCapBot = GAME_H - GROUND_H;
    if (circleRect(cx, cy, r, capX, p.gapBot, capW2, botCapBot - p.gapBot)) return true;
  }
  return false;
}

function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nearX = Math.max(rx, Math.min(cx, rx + rw));
  const nearY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nearX, dy = cy - nearY;
  return dx * dx + dy * dy < r * r;
}

// ── MEDALS ────────────────────────────────────────────────
function getMedal(s) {
  if (s >= 40) return { label: 'PLATINUM', color: '#E8F4FD', glow: '#a0d8ef' };
  if (s >= 20) return { label: 'GOLD',     color: '#FFD700', glow: '#FFB300' };
  if (s >= 10) return { label: 'SILVER',   color: '#C0C0C0', glow: '#9E9E9E' };
  if (s >= 1)  return { label: 'BRONZE',   color: '#CD7F32', glow: '#A0522D' };
  return null;
}

function drawMedal(medal, x, y) {
  ctx.save();
  ctx.translate(x, y);
  // Glow
  const glowGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 30);
  glowGrad.addColorStop(0, medal.glow + 'aa');
  glowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 30, 0, Math.PI * 2);
  ctx.fill();
  // Circle
  ctx.beginPath();
  ctx.arc(0, 0, 22, 0, Math.PI * 2);
  ctx.fillStyle = medal.color;
  ctx.fill();
  ctx.strokeStyle = '#00000066';
  ctx.lineWidth = 3;
  ctx.stroke();
  // Star
  drawStar(ctx, 0, 0, 5, 12, 6, '#fff8', '#0002');
  // Label
  ctx.font = `7px 'Press Start 2P', monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = '#333';
  ctx.fillText(medal.label, 0, 38);
  ctx.restore();
}

function drawStar(ctx, cx, cy, spikes, outerR, innerR, fill, stroke) {
  let rot = (Math.PI / 2) * 3;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += step;
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}

// ── UI PANELS ─────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawPanel(x, y, w, h) {
  // Shadow
  ctx.save();
  ctx.shadowColor = '#0005';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 6;
  roundRect(x, y, w, h, 12);
  // Wooden gradient
  const pg = ctx.createLinearGradient(x, y, x, y + h);
  pg.addColorStop(0, '#F5DEB3');
  pg.addColorStop(0.5, '#DEB887');
  pg.addColorStop(1, '#C8A878');
  ctx.fillStyle = pg;
  ctx.fill();
  ctx.restore();
  // Border
  ctx.strokeStyle = '#8B6914';
  ctx.lineWidth = 4;
  roundRect(x, y, w, h, 12);
  ctx.stroke();
  // Inner highlight
  roundRect(x + 4, y + 4, w - 8, h / 2 - 4, 8);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fill();
}

function drawScoreBox(label, value, x, y, w, h) {
  // Box
  roundRect(x, y, w, h, 8);
  ctx.fillStyle = '#5B8A0F';
  ctx.fill();
  roundRect(x + 3, y + 3, w - 6, h - 3, 6);
  ctx.fillStyle = '#7AB824';
  ctx.fill();
  // Label
  ctx.font = `12px 'Press Start 2P', monospace`;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#E8F4D0';
  ctx.fillText(label, x + w / 2, y + 24);
  // Value
  pixelText(String(value), x + w / 2, y + h - 24, 34, '#fff', '#2a4a00');
}

// ── START SCREEN ──────────────────────────────────────────
function drawStartScreen() {
  // Semi-overlay
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  // Title banner - taller for 3 lines
  const bx = 30, by = 150, bw = GAME_W - 60, bh = 110;
  drawPanel(bx, by, bw, bh);
  pixelText('FLAPPY', GAME_W / 2, by + 28, 26, '#FFE033', '#7B4A00');
  pixelText('BIRD', GAME_W / 2, by + 62, 26, '#fff', '#7B4A00');
  pixelText('RAMAN', GAME_W / 2, by + 96, 26, '#FF6B35', '#7B0000');

  // Bird preview (bobbing) - centered, no duplicate game bird
  const bob = Math.sin(frame * 0.07) * 6;
  if (birdLoaded) {
    ctx.save();
    ctx.translate(GAME_W / 2, 330 + bob);
    ctx.drawImage(birdImg, -40, -40, 80, 80);
    ctx.restore();
  }

  // Get Ready text
  pixelText('GET READY!', GAME_W / 2, 420, 18, '#fff', '#000');

  // Tap hint with pulsing opacity
  const pulse = 0.75 + 0.25 * Math.sin(frame * 0.12);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.font = '32px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('👆', GAME_W / 2, 470);
  ctx.restore();
  pixelText('TAP TO FLAP', GAME_W / 2, 512, 14, '#fff', '#000');

  // Best score
  if (bestScore > 0) {
    pixelText('BEST: ' + bestScore, GAME_W / 2, 560, 13, '#FFD700', '#7B4A00');
  }
}

// ── GAME OVER SCREEN ──────────────────────────────────────
function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  // GAME OVER title
  pixelText('GAME OVER', GAME_W / 2, 220, 30, '#fff', '#000');

  // Main panel
  const px = 30, py = 260, pw = GAME_W - 60, ph = 210;
  drawPanel(px, py, pw, ph);

  // Score boxes
  drawScoreBox('SCORE', score, px + 16, py + 28, (pw - 48) / 2, 90);
  drawScoreBox('BEST', bestScore, px + pw / 2 + 8, py + 28, (pw - 48) / 2, 90);

  // Medal
  const medal = getMedal(score);
  if (medal) {
    drawMedal(medal, px + pw / 2, py + 172);
  }

  // New best badge
  if (score === bestScore && score > 0) {
    ctx.save();
    ctx.translate(px + pw - 60, py + 20);
    ctx.rotate(-0.25);
    ctx.fillStyle = '#FF4444';
    roundRect(-28, -14, 56, 28, 6);
    ctx.fill();
    ctx.font = `8px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText('NEW BEST!', 0, 4);
    ctx.restore();
  }

  // Buttons
  const btnW = 150, btnH = 52, gap = 16;
  const totalW = btnW * 2 + gap;
  const bx1 = (GAME_W - totalW) / 2;
  const bx2 = bx1 + btnW + gap;
  const by2 = py + ph + 32;

  drawButton('PLAY AGAIN', bx1, by2, btnW, btnH, '#FFE033', '#c8a800');
  drawButton('MENU', bx2, by2, btnW, btnH, '#fff', '#aaa');

  pixelText('TAP TO CONTINUE', GAME_W / 2, by2 + btnH + 36, 16, '#fff', '#000');
}

function drawButton(label, x, y, w, h, color, shadow) {
  // Shadow
  roundRect(x + 4, y + 6, w, h, 10);
  ctx.fillStyle = shadow;
  ctx.fill();
  // Button
  roundRect(x, y, w, h, 10);
  const bg = ctx.createLinearGradient(x, y, x, y + h);
  bg.addColorStop(0, lighten(color, 20));
  bg.addColorStop(1, color);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = '#00000044';
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, 10);
  ctx.stroke();
  // Label
  pixelText(label, x + w / 2, y + h / 2 + 2, 13, '#222', '#ffffff88');
}

function lighten(hex, pct) {
  // Very simple lighten
  const c = parseInt(hex.replace('#', ''), 16);
  const r = Math.min(255, ((c >> 16) & 0xFF) + pct);
  const g = Math.min(255, ((c >>  8) & 0xFF) + pct);
  const b = Math.min(255, ( c        & 0xFF) + pct);
  return `rgb(${r},${g},${b})`;
}

// ── SCORE DISPLAY ─────────────────────────────────────────
function drawScore() {
  pixelText(String(score), GAME_W / 2, 60, 48, '#fff', '#000');
}

// ── MAIN LOOP ─────────────────────────────────────────────
let died = false;

function update() {
  frame++;
  cloudX = frame;

  if (state === 'playing') {
    // Physics
    bird.vy += GRAVITY;
    bird.y  += bird.vy;
    bird.angle = bird.vy * 4.5;

    // Ground scroll
    groundX = (groundX - PIPE_SPEED * 1.6) % 52;

    // Spawn pipes
    if (frame % PIPE_INTERVAL === 0) spawnPipe();

    // Move pipes
    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.scored && p.x + PIPE_W < BIRD_X) {
        p.scored = true;
        score++;
      }
    }
    pipes = pipes.filter(p => p.x > -PIPE_W - 30);

    // Particles
    flapParticles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.life -= 0.06;
    });
    flapParticles = flapParticles.filter(p => p.life > 0);

    // Collision
    if (checkHit()) {
      state = 'dead';
      deathTimer = 0;
      screenShake = 14;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('flappyRamanBest2', bestScore);
      }
    }
  }

  if (state === 'dead') {
    deathTimer++;
    bird.vy += GRAVITY * 1.2;
    bird.y  += bird.vy;
    bird.angle = 90;
    if (screenShake > 0) screenShake--;
    if (deathTimer > 55) state = 'gameover';
  }
}

function draw() {
  ctx.clearRect(0, 0, GAME_W, GAME_H);

  // Screen shake
  ctx.save();
  if (screenShake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake,
      (Math.random() - 0.5) * screenShake
    );
  }

  // Sky
  drawSky();

  // Pipes (behind bird)
  for (const p of pipes) {
    const botY = p.gapBot;
    const botH = GAME_H - GROUND_H - p.gapBot;
    drawPipe(p.x, p.gapTop, botY, botH);
  }

  // Ground
  drawGround(state === 'playing' || state === 'start');

  // Particles
  flapParticles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Bird (hide during start screen - preview shown there instead)
  if (state !== 'start' && !(state === 'dead' && bird.y > GAME_H)) {
    drawBird();
  }

  // Score (during play)
  if (state === 'playing' || state === 'dead') {
    drawScore();
  }

  // UI screens
  if (state === 'start') drawStartScreen();
  if (state === 'gameover') drawGameOverScreen();

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
